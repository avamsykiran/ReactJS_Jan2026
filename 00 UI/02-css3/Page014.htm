<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Template Areas Example</title>
    <style>
        /* Reset & Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.5;
            color: #1e293b;
            background-color: #f8fafc;
        }

        /* Style the grid items for visibility */
        .page-layout>* {
            padding: 1.5rem;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 0.375rem;
        }

        /* ===================================================
       1. Mobile Layout (Single Column)
       =================================================== */
        .page-layout {
            display: grid;
            gap: 1rem;
            padding: 1rem;
            min-height: 100vh;
            grid-template-areas:
                "header"
                "nav"
                "main"
                "sidebar"
                "footer";
        }

        /* Assign elements to area names */
        .site-header {
            grid-area: header;
            background-color: #e0f2fe;
        }

        .site-nav {
            grid-area: nav;
            background-color: #f0fdf4;
        }

        .site-main {
            grid-area: main;
            background-color: #ffffff;
        }

        .site-sidebar {
            grid-area: sidebar;
            background-color: #fefce8;
        }

        .site-footer {
            grid-area: footer;
            background-color: #f1f5f9;
        }

        /* ===================================================
       2. Desktop Layout (3-Column Layout)
       =================================================== */
        @media (min-width: 768px) {
            .page-layout {
                grid-template-columns: 200px 1fr 250px;
                grid-template-rows: auto 1fr auto;
                grid-template-areas:
                    "header  header  header"
                    "nav     main    sidebar"
                    "footer  footer  footer";
            }
        }
    </style>
</head>

<body>

    <!-- Semantic HTML Structure matching the Accessibility Tree -->
    <div class="page-layout">
        <header class="site-header">
            <h1>Site Title</h1>
        </header>

        <nav class="site-nav" aria-label="Primary Navigation">
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#services">Services</a></li>
            </ul>
        </nav>

        <main class="site-main">
            <h2>Main Content Area</h2>
            <p>Resize the browser window to see the CSS <code>grid-template-areas</code> layout automatically adjust
                between mobile and desktop views.</p>
        </main>

        <aside class="site-sidebar">
            <h3>Sidebar</h3>
            <p>Widgets or extra links go here.</p>
        </aside>

        <footer class="site-footer">
            <p>&copy; 2026 Semantic Grid Example. All rights reserved.</p>
        </footer>
    </div>

</body>

</html>
